<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mahmut Oklu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      color: #333333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 70px 25px 30px;
      text-align: center;
    }

    .profile-image {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 500;
      color: #222;
    }

    .title {
      margin-top: 10px;
      margin-bottom: 35px;

      font-size: 1.15rem;
      font-weight: 400;
      color: #666;
    }

    .navigation {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .navigation a {
      color: #333;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.2s ease;
    }

    .navigation a:hover {
      color: #888;
    }

    hr {
      width: 100%;
      margin: 55px 0 25px;
      border: 0;
      border-top: 1px solid #eeeeee;
    }

    footer {
      margin-top: auto;
      padding-top: 20px;

      color: #999;
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 50px;
      }

      .profile-image {
        width: 125px;
        height: 125px;
      }

      h1 {
        font-size: 1.9rem;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      class="profile-image"
      src="/images/profile.jpg"
      alt="Mahmut Oklu"
    >

    <h1>Mahmut Oklu</h1>

    <div class="title">
      System Admin
    </div>

    <nav class="navigation">
      <a href="/posts/">posts</a>
      <a href="/about/">about</a>
      <a href="/projects/">projects</a>
    </nav>

    <hr>

    <footer>
      © 2026. Mahmut Oklu.
    </footer>

  </main>

</body>
</html>
