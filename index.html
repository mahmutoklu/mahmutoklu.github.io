<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mahmut Oklu</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      color: #333333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 70px 25px 30px;
      text-align: center;
    }

    .profile-image {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 500;
      color: #222;
    }

    .title {
      margin-top: 10px;
      margin-bottom: 25px;

      font-size: 1.15rem;
      font-weight: 400;
      color: #666;
    }

    /* Social Icons */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      margin-bottom: 35px;
    }

    .social-links a {
      color: #555;
      text-decoration: none;
      font-size: 1.35rem;
      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .social-links a:hover {
      color: #000;
      transform: translateY(-2px);
    }

    .navigation {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .navigation a {
      color: #333;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.2s ease;
    }

    .navigation a:hover {
      color: #888;
    }

    hr {
      width: 100%;
      margin: 55px 0 25px;
      border: 0;
      border-top: 1px solid #eeeeee;
    }

    footer {
      margin-top: auto;
      padding-top: 20px;

      color: #999;
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 50px;
      }

      .profile-image {
        width: 125px;
        height: 125px;
      }

      h1 {
        font-size: 1.9rem;
      }

      .social-links {
        gap: 19px;
      }

      .social-links a {
        font-size: 1.25rem;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      class="profile-image"
      src="images/mahmutoklu.jpeg"
      alt="Mahmut Oklu"
    >

    <h1>Mahmut Oklu</h1>

    <div class="title">
      System Admin
    </div>

    <!-- Social Links -->
    <div class="social-links">

      <!-- GitHub -->
      <a
        href="https://github.com/mahmutoklu"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
        title="GitHub"
      >
        <i class="fa-brands fa-github"></i>
      </a>

      <!-- X / Twitter -->
      <a
        href="https://twitter.com/YOUR_USERNAME"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="X / Twitter"
        title="X / Twitter"
      >
        <i class="fa-brands fa-x-twitter"></i>
      </a>

      <!-- LinkedIn -->
      <a
        href="https://www.linkedin.com/in/YOUR_USERNAME/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
        title="LinkedIn"
      >
        <i class="fa-brands fa-linkedin-in"></i>
      </a>

      <!-- Google Scholar -->
      <a
        href="https://scholar.google.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Google Scholar"
        title="Google Scholar"
      >
        <i class="fa-solid fa-graduation-cap"></i>
      </a>

      <!-- Email -->
      <a
        href="mailto:oklumahmut@hotmail.com"
        aria-label="Email"
        title="Email"
      >
        <i class="fa-solid fa-envelope"></i>
      </a>

    </div>

    <nav class="navigation">
      <a href="/posts/">posts</a>
      <a href="/about/">about</a>
      <a href="/projects/">projects</a>
    </nav>

    <hr>

    <footer>
      © 2026. Mahmut Oklu.
      <div>Hugo, themed by LoveIt</div>
      <div>Some Rights Reserved</div>
    </footer>

  </main>

</body>
</html>
